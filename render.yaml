services:
  - type: web
    name: expert-booking-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: MONGO_URI
        sync: false # You will set this in the Render UI
      - key: CLIENT_URL
        sync: false # You will set this to your Vercel/Netlify URL
